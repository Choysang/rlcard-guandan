services:
  guandan-gui:
    image: "${GUANDAN_GUI_IMAGE:-ghcr.io/choysang/rlcard-guandan-gui:feat-web-gui}"
    container_name: guandan-gui
    restart: unless-stopped
    ports:
      - "${GUANDAN_GUI_BIND:-127.0.0.1}:${GUANDAN_GUI_PUBLIC_PORT:-5000}:5000"
    environment:
      GUANDAN_GUI_PORT: "5000"
      GUANDAN_GUI_LOG_DIR: "/data/logs/gui"
      GUANDAN_GUI_CORS: "${GUANDAN_GUI_CORS:-*}"
      GUANDAN_GUI_AI_DELAY: "${GUANDAN_GUI_AI_DELAY:-0.8}"
      GUANDAN_GUI_AI_SLOW_DELAY: "${GUANDAN_GUI_AI_SLOW_DELAY:-1.6}"
      GUANDAN_GUI_OPEN_BROWSER: "false"
      GUANDAN_MODEL_DIR: "/data/weights"
      GUANDAN_DMC_MODEL_TAR: "${GUANDAN_DMC_MODEL_TAR:-/data/weights/dmc/model.tar}"
      GUANDAN_DANZERO_PLUS_MODEL_TAR: "${GUANDAN_DANZERO_PLUS_MODEL_TAR:-/data/weights/danzero_plus/model.tar}"
      GUANDAN_PERFECTDAN_MODEL: "${GUANDAN_PERFECTDAN_MODEL:-/data/weights/perfectdan/models_v0.pt}"
    volumes:
      - guandan-gui-data:/data
      - "${GUANDAN_GUI_WEIGHTS_DIR:-./weights}:/data/weights:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  guandan-gui-data:
